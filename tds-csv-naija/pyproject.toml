[project]
name = "tds-csv-naija"
version = "0.1.0"
description = "Quickly explore a CSV file from the command line."
readme = "README.md"
license = "MIT"
authors = [
    { name = "Naija Hodigere", email = "naijahodigere11@gmail.com" },
]
requires-python = ">=3.11"
dependencies = [
    "pandas>=3.0.3",
    "rich>=13",
    "typer>=0.26.7",
]
[project.scripts]
tds-csv = "cli:app"

[project.urls]
"Homepage" = "https://github.com/winterwidow/tds-csv-naija"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[tool.hatch.build.targets.wheel]
packages = ["."]
include = ["cli.py"]